name: library
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        profile: [default, joint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.5 zstandard==0.25.0
      - run: python -m pip install -r tools/requirements-geometry.txt
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DTMAP_EMBEDDED_CHECKS=ON -DTMAP_TEST_GEOMETRY=ON
      - if: matrix.profile == 'joint'
        run: cmake -S . -B build -DTMAP_CACHE_PAGE_BYTES=1024 -DTMAP_PACKAGE_SECTION_SLOTS=37
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake -S . -B build-core -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DBUILD_TESTING=OFF -DTMAP_BUILD_EXAMPLES=OFF -DTMAP_NATIVE_FILE=OFF -DTMAP_EMBEDDED_CHECKS=ON
      - run: cmake --build build-core
